name: Actualizar Noticias de IA y Gobernanza

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install feedparser

      - name: Recopilar noticias y compilar sitio estático
        run: |
          python build_site.py

      - name: Guardar y publicar cambios si hay nuevas noticias
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html translations_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de noticias de IA [skip ci]" && git push)
